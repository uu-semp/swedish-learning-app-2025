<div id="sr-info-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>Spaced repetition</h2>

        <p>
            För att komma ihåg dina framsteg sparas information om vilka ord
            du har tränat på och när de ska repeteras igen.
            Informationen sparas lokalt i din webbläsare.
        </p>

        <div class="modal-actions">
            <button id="sr-accept-btn" class="modal-btn">
                Godkänn och aktivera
            </button>

            <button id="sr-info-cancel-btn" class="close-btn">
                Avbryt
            </button>
        </div>
    </div>
</div>


<div id="sr-delete-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>Är du säker?</h2>

        <p>
            Alla sparade Spaced Repetition-framsteg kommer att raderas.
            Detta går inte att ångra.
        </p>

        <div class="modal-actions">
            <button id="sr-delete-confirm-btn" class="modal-btn danger-btn">
                Radera
            </button>

            <button id="sr-delete-cancel-btn" class="close-btn">
                Avbryt
            </button>
        </div>
    </div>
</div>
