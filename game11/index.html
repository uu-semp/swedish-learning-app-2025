<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grocery shopping!</title>

    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/png" href="../game11/assets/favicon.png">

    <script src="../scripts/vocabulary.js"></script>
    <script src="../scripts/save.js"></script>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <link rel="stylesheet" href="index.css" />
    <script>window.vocabulary.load_game_data(11);</script>

    <script type="module" src="data.js" defer></script>
    <script type="module" src="main.js" defer></script>
    <script type="module" src="ui.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Game 11</h1>
    </header>

    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h2 style="margin: 0 0 10px 0; text-align: center;">Meny</h2>

        <button class="modal-btn">Info</button>
        <button id="restart-btn" class="modal-btn">Börja om</button>
        <button id = "mode2-btn" class="modal-btn">växla läge</button>

        <hr style="margin: 12px 0; border: 1px dashed #ccc;">

        <div class="setting-row">
          <span>Hög kontrast</span>
          <button id="toggle-contrast-btn" class="toggle-btn">AV</button>
        </div>

        <button id="close-settings-btn" class="close-btn">Stäng</button>
      </div>
    </div>

    <main class="game-frame">
      <img src="../game11/assets/paper.png" alt="Paper" class="paper">
      <img src="../game11/assets/character.png" alt="Character"
        class="character">
      <img src="../game11/assets/shoppingcart.png" alt="Shopping Cart"
        class="cart">
      <img src="../game11/assets/shelf.png" alt="Shelf" class="shelf">
      <div class="instructions" role="note" aria-label="Game instructions">
        <p>
          <strong>Hur du spelar</strong><br>
          Hitta objekten från inköpslistan på hyllan,<br>
          klicka eller dra och släpp den i varukorgen.
        </p>
      </div>

      <div class="shelf_items"></div>
      <div class="shopping_list"></div>

      <section class="popup-frame-wrap">
        <iframe
          src="./popup.html"
          title="Popup UI"
          class="popup-frame"
          loading="lazy"
          referrerpolicy="no-referrer"
          id="popupFrame">
        </iframe>
      </section>

      <div class="top-left-controls">
        <div class="status-bar" id="statusBar">
          <span id="progressPill">0 / 10 klara</span> |
          <span id="firstTryPill">Rätt: 0</span> |
          <span id="mistakesPill">Misstag: 0</span> |
          <span id="targetPill">Tröskel: 8 / 10</span>
        </div>
      </div>

      <div class="top-right-controls">
        <div class="menu-wrapper">
          <button id="main-menu-btn" class="menu-btn">Menu ☰</button>

        </div>
      </div>

      <div class="chatbubble-toasts"></div>

      <div class="cart-dropzone" aria-label="Varukorg droppzon">
        <div class="cart_items" aria-live="polite"></div>
      </div>
    </main>

    <footer>
      <small>Created as part of the
        "Software Engineering and Project Management" course 2025</small>
    </footer>

    <script>
    function setIframeInteractive(on) {
      const wrap  = document.querySelector('.popup-frame-wrap');
      const frame = document.querySelector('.popup-frame');
      if (!wrap || !frame) return;
      wrap.style.pointerEvents  = on ? 'auto' : 'none';
      frame.style.pointerEvents = on ? 'auto' : 'none';
      wrap.classList.toggle('is-endgame', on);
    }

    const popupFrame = document.getElementById('popupFrame');

    const keyFromImgPath = (p) => {
      if (!p) return undefined;
      const base = p.split('/').pop() || '';
      return base.split('.')[0].toLowerCase();
    };

    function mapWordsFromState(gs) {
      const raw = Array.isArray(gs?.shoppingList) ? gs.shoppingList : [];
      const words = raw.map(item => {
        const idKey =
          keyFromImgPath(item?.img) ||
          (item?.id != null ? String(item.id).toLowerCase() : undefined) ||
          (item?.en ? String(item.en).toLowerCase() : undefined) ||
          (item?.sv ? String(item.sv).toLowerCase() : undefined);
        const svLabel = item?.sv ?? item?.en ?? '';
        return { id: idKey, sv: svLabel };
      }).filter(w => !!w.id);
      return words;
    }

    window.sendPickToPopup = function(idKey, label) {
      if (!popupFrame || !popupFrame.contentWindow) return;
      console.log('[parent] sending pick (key):', idKey);
      popupFrame.contentWindow.postMessage({ type: 'pick', id: String(idKey), label }, '*');
    };

    let popupIsReady = false;
    let initSent = false;

    function haveShoppingList() {
      const gs = window.__game11GameState;
      return !!(gs && Array.isArray(gs.shoppingList) && gs.shoppingList.length > 0);
    }

    // Returns true only once the popup has confirmed with initDone, so the
    // retry loop keeps going if the initWords message never lands
    function tryInitPopupOnce() {
      if (initSent) return true;
      if (!popupIsReady || !haveShoppingList()) return false;
      const gs = window.__game11GameState;
      const words = mapWordsFromState(gs);
      popupFrame?.contentWindow?.postMessage({ type: 'initWords', words }, '*');
      return false;
    }

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'statusUpdate') {
        const s = data.status; if (!s) return;
        document.getElementById('progressPill').textContent = s.progress;
        document.getElementById('firstTryPill').textContent = s.firstTry;
        document.getElementById('mistakesPill').textContent = s.mistakes;
        document.getElementById('targetPill').textContent = s.target;
        if (typeof s.index === 'number' || typeof s.index === 'string') {
          window.Game11UI?.highlightListIndex?.(s.index);
        }
      } else if (data.type === 'popupReady') {
        popupIsReady = true;
        tryInitPopupOnce();
      } else if (data.type === 'initDone') {
        initSent = true;
      }
      if (data.type === 'endgameOpen') { setIframeInteractive(true); return; }
      if (data.type === 'endgameClose') { setIframeInteractive(false); return; }
    });

    window.addEventListener('game11:ready', () => { tryInitPopupOnce(); });

   window.addEventListener('DOMContentLoaded', () => {

      popupFrame?.addEventListener('load', () => tryInitPopupOnce());
      let attempts = 0;
      const timer = setInterval(() => {
        if (tryInitPopupOnce()) { clearInterval(timer); }
        else if (++attempts > 100) clearInterval(timer);
      }, 100);

      const menuBtn = document.getElementById('main-menu-btn');
      const settingsModal = document.getElementById('settings-modal');
      const closeSettingsBtn = document.getElementById('close-settings-btn');

      if (menuBtn && settingsModal && closeSettingsBtn) {
        menuBtn.addEventListener('click', (e) => {
          e.preventDefault();
          settingsModal.classList.remove('hidden');
        });

        closeSettingsBtn.addEventListener('click', (e) => {
          e.preventDefault();
          settingsModal.classList.add('hidden');
        });
      }

      const restartBtn = document.getElementById('restart-btn');
      if (restartBtn) {
        restartBtn.addEventListener('click', () => {
          localStorage.removeItem('game11_game_state');

          window.location.reload();
        });
      }

      // This is the mode 2 button, which reloads the page and make the shopping list only show english words.
      // while the shelf only swedish words
      const Mode2Btn = document.getElementById('mode2-btn');
      if (Mode2Btn) {
        Mode2Btn.addEventListener('click', () => {
          const state = window.__game11GameState;
          if(state.mode == 1) {
            state.mode = 2;
          } else {
            state.mode = 1;
          }
          localStorage.setItem(
            'game11_game_state',
            JSON.stringify(state)
          );
          window.location.reload();
        });
      }


      const toggleContrastBtn = document.getElementById('toggle-contrast-btn');
      if (toggleContrastBtn) {
        toggleContrastBtn.addEventListener('click', () => {
          document.body.classList.toggle('high-contrast-mode');
          const isActive = document.body.classList.contains('high-contrast-mode');
          toggleContrastBtn.textContent = isActive ? 'PÅ' : 'AV';
          toggleContrastBtn.classList.toggle('active', isActive);
        });
      }

    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'pickResult' && typeof data.id === 'string') {
        if (data.ok) {
          window.Game11UI?.placeItemInCart?.(data.id);
        } else {
          // document.querySelector('.cart-dropzone')?.animate([...],{duration:180});
        }
      }
    });

    //same as resart ? what is the difference between restart and playAgain?

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'playAgain') {
        document.querySelector('.popup-frame-wrap').style.display = 'none';
          localStorage.removeItem('game11_game_state');
          window.location.reload();
      }
    });
  </script>
  </body>
</html>
