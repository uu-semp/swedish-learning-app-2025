<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>

  <div class="screen" role="application" aria-label="Dress the cat game screen">
    <section class = "status-bar">
      <h2 id="level-title">Level</h2>
      <button id="backToIndex-btn" class="undoBtn giveUpBtn" aria-label="Back to level-selection"> Back to level-selecting-page</button>
    </section>
    <section class="instructions">
            <p id="instruction-text">
        instructions here
      </p>
    </section>
    <section class="stage" aria-label="Cat stage">
              <button id="undo-btn" class="confirmBtn undoBtn" aria-label="Undo last change" disabled>Undo</button>
        <button id="clear-btn" class="confirmBtn undoBtn clearBtn" aria-label="Remove all clothing" disabled>Remove all</button>
      <img src="paperpelletransparent.png" alt="Cat to dress" class="cat-image"/>
      
      <div id="hat-box" class="dropzone hat" data-accept="hat"></div>
      <div id="shirt-box" class="dropzone shirt" data-accept="shirt"></div>
      <div id="pants-box" class="dropzone bottom" data-accept="pants"></div>
    </section>

    <aside class="sidebar" aria-label="Wardrobe">
      <div class="wardrobe-box" id="img-menu"></div>
    </aside>

    <div class="submissionbar" aria-live="polite">

      <div class="div-buttons">
        <button id="confirm-btn" class="confirmBtn" aria-label="Confirm outfit">Confirm Outfit</button>
        <button id="giveUp-btn" class="undoBtn giveUpBtn" aria-label="Give up">Give up</button>
      </div>
      <div class="feedback"> 
        <p id="result-text"></p>
      </div>
      <div>
         <button id="next-btn" class="confirmBtn undoBtn nextBtn" aria-label="Next round" disabled>Next</button>
        <button id="nextLevel-btn" class=" giveUpBtn" aria-label="Next level" >Next Level</button>
      </div>  
    </div>
  </div>

  

  <!-- Popup window -->
<div id="popup" class="popup">
  <div class="popup-content">
    <h2></h2>
    <p id="result-text"></p> <!-- ✅ added id so JS can update text -->
    <div class="menu-buttons">
      <button id="playAgainBtn" class="btn">Play Again!</button>
      <button id="backToMenuBtn" class="btn">Go back to start menu!</button>
    </div>
  </div>
</div>

<script>
    // Get selected level from the URL
  const params = new URLSearchParams(window.location.search);
  const level = params.get("level");

  // Show selected level
  document.getElementById("level-title").textContent = "Level " + level;


  const popup = document.getElementById('popup');
  const confirmBtn = document.getElementById('confirm-btn'); // ✅ make sure your button has this id
  const playAgainBtn = document.getElementById('playAgainBtn');
  const backToMenuBtn = document.getElementById('backToMenuBtn');
  const resultText = document.getElementById('result-text');
  const giveUpBtn = document.getElementById("giveUp-btn")
  const nextBtn = document.getElementById("next-btn");
  const nextLvlBtn = document.getElementById("nextLevel-btn");
  const backtoIndexBtn = document.getElementById("backToIndex-btn");
  let correct_answer = false;

  confirmBtn.addEventListener('click', () => {
    // run your existing checkClothes() function
    const outfit = window.currentOutfit;
    correct_answer = false; // Reset correct_answer before checking
    if (!outfit) return;

    //Just add more categories here based on level, maybe add an if-statement 
    // to check appropriate categories
    const correctHat = outfit.items.hat.imgId;
    const correctShirt = outfit.items.shirt.imgId;
    const correctPants = outfit.items.pants.imgId;



    const appliedHat = document.getElementById("hat-box").children[0]?.dataset.id;
    const appliedShirt = document.getElementById("shirt-box").children[0]?.dataset.id;
    const appliedPants = document.getElementById("pants-box").children[0]?.dataset.id;

    const missingItems = [];
    const wrongItems = [];

    if (!appliedHat) missingItems.push("hat");
    if (!appliedShirt) missingItems.push("shirt");
    if (!appliedPants) missingItems.push("pants");

    if (missingItems.length > 0) {
      resultText.textContent = `❌ Missing items: ${missingItems.join(", ")}, Try again!`;
      resultText.style.color = "red";
      popup.style.display = 'flex'; // show popup after checking
      return;
    }
    if (appliedHat !== correctHat) wrongItems.push("hat");
    if (appliedShirt !== correctShirt) wrongItems.push("shirt");
    if (appliedPants !== correctPants) wrongItems.push("pants");

    if (correctHat === appliedHat && correctShirt === appliedShirt && correctPants === appliedPants) {
      correct_answer = true;
      resultText.textContent = "✅ Correct!";
      resultText.style.color = "green";
      const stats = window.save.stats.get("game13");
      console.log("Stats:");
      console.log(stats);
      const wins = stats.wins;
        window.save.stats.set("game13", wins + 1, 0);
      nextBtn.disabled = false;
    } else {
      resultText.textContent = "❌ Incorrect items: " + wrongItems.join(", ") + ", Try again!";
      resultText.style.color = "red";
    }

    // popup.style.display = 'flex'; // show popup after checking
  });

  playAgainBtn.addEventListener('click', () => {

    if (correct_answer) {
        window.clearWardrobe();
        window.nextInstruction();
        correct_answer = false;
    }
});

  giveUpBtn.addEventListener('click', ( )=> {
    nextBtn.disabled = false;
  })

  nextBtn.addEventListener('click', ( )=> {
    nextBtn.disabled = true;
    location.reload();
  })

    nextLvlBtn.addEventListener("click", () => {
  const nextLevel = Number(level) + 1;

  window.location.href = "level_introduction.html?level=" + nextLevel;
});

    backtoIndexBtn.addEventListener('click', ( )=> {
    window.location.href = "index.html";
  })

</script>


<script src="../scripts/vocabulary.js" defer></script>
<script type="module" src="index.js"></script>
<script src="../scripts/save.js" defer></script>
</body>
</html>
