<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/game.css" />
</head>

<body>

  <div class="screen" role="application" aria-label="Dress the cat game screen">

    <section class = "bar status-bar ">
      <h2><span id="level-title">Level</span> <small id="score-text" aria-live="polite"></small></h2>
      <button id="backToIndex-btn" class="undoBtn giveUpBtn" aria-label="Back to level-selection"> Back to level-selecting-page</button>
    </section>

    <section class="game-area">

      <section class="stage" aria-label="Cat stage">
        <div class = "tool-buttons-wrapper">
          <button id="undo-btn" class="btn toolBtn" aria-label="Undo last change" disabled>Undo</button>
          <button id="clear-btn" class="btn toolBtn" aria-label="Remove all clothing" disabled>Remove all</button>
        </div>


      <section class="speech-bubble instructions">
        <p id="instruction-text">
        instructions here
        </p>
      </section>

      <div class="speech-bubble feedback"> 
          <p id="result-text"></p>
      </div>
        <div class = paper-pelle-area>
          <!-- Pelle, every garment and his raised hand are drawn on the same
               canvas, so they are stacked as same-size layers (see game.css) -->
          <div class="pelle-stack">
            <img src="../assets/game13/pelle.png" alt="Cat to dress" class="paper-pelle-image"/>
            <div class="dropzone-area">
              <!-- data-accept is the word list's Subcategory for clothes worn there -->
              <div id="hat-box" class="dropzone headwear" data-accept="hats"></div>
              <div id="face-box" class="dropzone face" data-accept="accessories"></div>
              <div id="shirt-box" class="dropzone top" data-accept="shirts"></div>
              <div id="pants-box" class="dropzone bottom" data-accept="pants"></div>
              <div id="feet-box" class="dropzone shoes" data-accept="feet"></div>
            </div>
            <img src="../assets/game13/pelle_hand.png" alt="" class="pelle-hand"/>
          </div>
      </div>


    </section>

    <!-- Shelves are created by wardrobe_ui.js, one per body position in the level -->
    <aside class="wardrobe" id="wardrobe" aria-label="Wardrobe"></aside>
    </section>
          <div class="bar submissionbar" aria-live="polite">
          <button id="giveUp-btn" class="btn toolBtn" aria-label="Give up">Give up</button>
          <button id="confirm-btn" class="btn confirmBtn" aria-label="Confirm outfit">Confirm Outfit</button>

          <button id="next-btn" class="btn nextBtn" aria-label="Next round" disabled>Next</button>
          <button id="nextLevel-btn" class=" btn toolBtn" aria-label="Next level" >Next Level</button>
      </div>
  </div>

<script src="../scripts/save.js"></script>
<script src="game/progress.js"></script>
<script>
    // Get selected level from the URL (defaults to level 1)
  const params = new URLSearchParams(window.location.search);
  const level = Number(params.get("level")) || 1;

  // Show selected level
  document.getElementById("level-title").textContent = "Level " + level;

  // Score for this level (REQ-STUDENT-7.1 / 7.2)
  const scoreText = document.getElementById("score-text");
  function showScore() {
    const { completed, firstTry } = window.progress.getLevel(level);
    scoreText.textContent = `Rounds: ${completed} · First try: ${firstTry}`;
  }
  showScore();

  // State for the current round
  let attempts = 0;       // confirmed full outfits this round
  let roundOver = false;  // true once the round is solved or given up

  function endRound(firstTry) {
    roundOver = true;
    window.progress.recordRound(level, firstTry);
    showScore();
    confirmBtn.disabled = true;
    giveUpBtn.disabled = true;
    nextBtn.disabled = false;
  }

  const popup = document.getElementById('popup');
  const confirmBtn = document.getElementById('confirm-btn');
  const backToMenuBtn = document.getElementById('backToMenuBtn');
  const resultText = document.getElementById('result-text');
  const giveUpBtn = document.getElementById("giveUp-btn")
  const nextBtn = document.getElementById("next-btn");
  const nextLvlBtn = document.getElementById("nextLevel-btn");
  const backtoIndexBtn = document.getElementById("backToIndex-btn");
  let correct_answer = false;
  const feedback = document.querySelector(".feedback");

  confirmBtn.addEventListener('click', () => {
    // run your existing checkClothes() function
    const outfit = window.currentOutfit;
    correct_answer = false; // Reset correct_answer before checking
    if (!outfit || roundOver) return;

    // Compare what Pelle wears with the outfit, one body position at a time.
    const missingItems = [];
    const wrongItems = [];
    for (const [subcategory, item] of Object.entries(outfit.items)) {
      const zone = document.querySelector(`.dropzone[data-accept="${subcategory}"]`);
      const appliedId = zone?.firstElementChild?.dataset.id;
      if (!appliedId) missingItems.push(subcategory);
      else if (appliedId !== item.imgId) wrongItems.push(subcategory);
    }

if (missingItems.length > 0) {
    resultText.textContent = `❌ Missing items: ${missingItems.join(", ")}, Try again!`;
    resultText.style.color = "red";
    feedback.classList.add("visible");
    return;
}
    attempts++; // a full outfit was confirmed


    if (wrongItems.length === 0) {
      correct_answer = true;
      resultText.textContent = "✅ Correct!";
      resultText.style.color = "green";
      endRound(attempts === 1);
      const stats = window.save.stats.get("game13");
      console.log("Stats:");
      console.log(stats);
      const wins = stats.wins;
        window.save.stats.set("game13", wins + 1, 0);
      nextBtn.disabled = false;
    } else {
      resultText.textContent = "❌ Incorrect items: " + wrongItems.join(", ") + ", Try again!";
      resultText.style.color = "red";
    }

    feedback.classList.add("visible");

  });

  nextBtn.addEventListener('click', () => {
    popup.style.display = 'none';

    if (correct_answer) {
        window.clearWardrobe();
        window.nextInstruction();
        correct_answer = false;
    }

});

  giveUpBtn.addEventListener('click', ( )=> {
    if (roundOver) return;
    endRound(false);
    nextBtn.disabled = false;
  })

  nextBtn.addEventListener('click', ( )=> {
    nextBtn.disabled = true;
    location.reload();
  })

    backtoIndexBtn.addEventListener('click', ( )=> {
    window.location.href = "index.html";
  })



</script>

<script type="module" src="index.js"></script>

<!-- Controls navigation between levels by hiding the Next Level button
on the final level and preventing navigation beyond the configured maximum. -->
<script type="module">
    import { MAX_LEVEL } from "./game/level_configuration.js";

    console.log("Level navigation module loaded");
    console.log("MAX_LEVEL:", MAX_LEVEL);

    const nextLvlBtn = document.getElementById("nextLevel-btn");
    const level = Number(new URLSearchParams(window.location.search).get("level")) || 1;

   // Disable the button and explain when the player has reached the final level.
if (level >= MAX_LEVEL) {
    nextLvlBtn.disabled = true;
    nextLvlBtn.textContent = "Final Level Reached!";
    nextLvlBtn.title = "You have completed all available levels.";
}

    // Navigate to the next level only if another level is available.
    nextLvlBtn.addEventListener("click", () => {
        if (level < MAX_LEVEL) {
            window.location.href = `level_introduction.html?level=${level + 1}`;
        }
    });
</script>

</body>
</html>
