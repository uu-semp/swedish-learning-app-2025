<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Hitta rätt hus</title>

    <link rel="stylesheet" href="./game.css">
   <script type="importmap">
    {
        "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
    }
    </script>

    <script src="../../../scripts/save.js"></script>
    <script type="module" src="./game_view.js"></script>

    <!-- Allows js files to import from 'vue'. -->
   
</head>

<body>
    <div id="loading-screen">
        <div id="loading", class="loading">Laddar databasen...</div>
    <div id="app" v-cloak>
        <main class="game-frame">
            <section id="game-screen">
                <div class="game-box">
                    <div class="game-top-row">
                        <div class="progress-wrap">
                            <div class="progress-label">
                                {{ display.language === "en" ? "Progress" : "Framsteg" }}:
                                {{ view.progress }} / {{ view.progressMax }}
                            </div>
                        </div>

                        <!-- Answer feedback -->
                        <p class="selection-feedback" role="status"s>
                            <template v-if="game.answer_locked">
                                <span v-if="game.answer_correct">
                                    {{ display.language === "en" ? "✓ Correct!" : "✓ Rätt!" }}
                                </span>

                                <span v-else>
                                    {{ display.language === "en"
                                        ? "✗ Incorrect answer."
                                        : "✗ Fel svar." }}
                                </span>

                                <span v-if="game.answer_correct && game.hint_used">
                                    {{ display.language === "en"
                                        ? " This question will be repeated."
                                        : " Frågan kommer igen." }}
                                </span>
                            </template>
                        </p>

                        <a href="../menu/index.html" class="start-page-button" @click="BackToMenu">
                            {{ display.language === "en"
                                ? "← Back to menu"
                                : "← Tillbaka till menyn" }}
                        </a>

                    </div>

                    <div
                                class="progress-bar"
                                role="progressbar"
                                :aria-label="display.language === 'en' ? 'Progress' : 'Framsteg'"
                                aria-valuemin="0"
                                :aria-valuemax="view.progressMax"
                                :aria-valuenow="view.progress"
                            >
                                <div
                                    id="progress-fill"    
                                    :style="{ width: progressPercentage }"
                                ></div>
                        </div>

                    <hr>
                
                    <!-- Question with individually translated words -->
                    <div
    id="prompt-words"
    :class="{
        'difficulty-2': game.difficulty === 2 || game.difficulty === 3,
        'difficulty-3': game.difficulty === 3
    }"
>
                        <button
                            v-for="(word, index) in view.promptWords"
                            :key="index"
                            type="button"
                            :aria-pressed="word.translated"
                            :lang="word.translated ? 'en' : 'sv'"
                            @click="translateWord(word)"
                            :disabled="!word.canTranslate || game.answer_locked || game.is_finished"
                        >
                            {{ word.translated ? word.en : word.sv }}
                        </button>
                    </div>

                    <!-- Existing road and house grid -->
                    <div
    class="board-scroll"
    :class="{
        'difficulty-2': game.difficulty === 2 || game.difficulty === 3,
        'difficulty-3': game.difficulty === 3
    }"
>
                        <div
                            id="house-grid-T"
                            :class="{ 'horizontal-only': game.difficulty === 2 || game.difficulty === 3}"
                        >
                            <div class="road horizontal-road-T">
                                <p class="street-text">
                                    {{ view.horizontalStreet }}
                                </p>

                                <div class="dotted-line"></div>
                            </div>

                            <div
                                v-if="game.difficulty === 1"
                                class="road vertical-road-T"
                            >
                                <p class="street-text">
                                    {{ view.verticalStreet }}
                                </p>

                                <div class="dotted-line"></div>
                            </div>

                            <template
                                v-for="house in visibleHouses"
                                :key="house.id"
                            >
                                <button
                                    v-if="house.type === 'HOUSE'"
                                    type="button"
                                    :disabled="game.answer_locked || game.is_finished"
                                    :style="{
                                        gridRow: house.row,
                                        gridColumn: house.col
                                    }"
                                    :class="{
                                        'is-selected': isSelected(house),
                                        'is-correct':
                                            isSelected(house) &&
                                            game.answer_correct === true,
                                        'is-incorrect':
                                            isSelected(house) &&
                                            game.answer_correct === false
                                    }"
                                    :aria-label="house.street + ' ' + house.houseNumber"
                                    :aria-pressed="
                                        view.selectedHouse !== null &&
                                        view.selectedHouse.id === house.id
                                    "
                                    @click="SelectHouse(house)"
                                >
                                    {{ house.houseNumber }}
                                </button>

                                <details
                                    v-else
                                    class="landmark"
                                    :style="{
                                        gridRow: house.row,
                                        gridColumn: house.col
                                    }"
                                >
                                    <summary :title ="display.language === 'en' ? house.nameEnglish : house.nameSwedish">
                                        <img
                                            :src="house.image"
                                            :alt="display.language === 'en'
                                                ? house.nameEnglish
                                                : house.nameSwedish"
                                        >
                                    </summary>

                                    <span class="landmark-name">
                                        {{ display.language === "en"
                                            ? house.nameEnglish
                                            : house.nameSwedish }}
                                    </span>
                                </details>
                            </template>
                        </div>
                    </div>
                    
                    <div
    v-if="game.difficulty === 3"
    class="transport-options"
>
        <button
        v-for="transport in view.transportOptions.slice(0, 3)"
        :key="transport.sv"
        type="button"
        class="transport-option"
        @click="SelectTransport(transport)"
        :class="{
            'is-selected': isTransportSelected(transport),
            'is-correct':
                isTransportSelected(transport) &&
                game.answer_locked &&
                game.answer_correct === true,
            'is-incorrect':
                isTransportSelected(transport) &&
                game.answer_locked &&
                game.answer_correct === false
        }"
        :disabled="game.answer_locked || game.is_finished"
        :aria-label="display.language === 'en'
            ? transport.en
            : transport.sv"
    >
        <img
            :src="transport.img"
            :alt="display.language === 'en'
                ? transport.en
                : transport.sv"
        >

        <span>
            {{ display.language === "en"
                ? transport.en
                : transport.sv }}
        </span>
    </button>
</div>

                    <hr>
                    <div class="hint-controls">

                        <div
                            v-if="view.showTranslation"
                            id="english-line"
                            lang="en"
                        >
                            {{ view.englishSentence }}
                        </div>

                        <!-- The Hint -->
                        <button
                            type="button"
                            class="control-button hint-button"
                            :aria-expanded="view.showTranslation"
                            aria-controls="english-line"
                            @click="toggleTranslation"
                            :disabled="game.answer_locked || game.is_finished"
                        >
                            <span v-if="view.showTranslation">
                                {{ display.language === "en" ? "Hide hint" : "Dölj ledtråd" }}
                            </span>
                            <span v-else>
                                {{ display.language === "en" ? "Hint" : "Ledtråd" }}
                            </span>
                        </button>
                        
                    </div>
                    
                </div>
            </section>
        </main>

    </div>
</body>
</html>
