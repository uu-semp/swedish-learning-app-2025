<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clothing Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css?v=3">
  <link rel="stylesheet" href="css/level-view.css?v=3">
</head>
<body>
  <main class="quiz play">

    <header class="play-top">
      <button class="backtoLevelSelect-btn" onclick="goBacktoLevelSelectpage()" aria-label="Back to levels">←</button>
      <div class="progress-wrap" aria-label="Progress">
        <div id="progress" class="progress"></div>
      </div>
      <button id="helpBtn" class="help-btn" aria-label="How to play">?</button>
    </header>

    <div id="resultPopup" class="result-Popup hidden" role="dialog" aria-modal="true">
      <button id="closeResult" class="close-btn" aria-label="Close">✕</button>
      <div class="stars" id="starContainer">⭐ ⭐ ⭐</div>
      <h2 id="resultTitle"></h2>
      <p id="mistakeInfo"></p>
      <div class="popup-actions">
        <button id="playAgainBtn" class="btn red">Play again</button>
        <button id="homeBtn" class="btn brown" onclick="goBacktomainpage()" aria-label="Main menu">🏠</button>
        <button id="nextLevelBtn" class="btn green">Next level →</button>
      </div>
    </div>

    <div id="helpPopup" class="help-popup hidden" role="dialog" aria-modal="true">
      <button id="closeHelp" class="close-btn" aria-label="Close">✕</button>
      <span class="help-icon" aria-hidden="true">💡</span>
      <h3>How to play</h3>
      <p>Click the right clothing item matching with the image!</p>
    </div>

    <section class="stage">
      <p class="prompt">Which word matches the picture?</p>

      <section class="image-area">
        <img id="vocabImg" alt="vocab image" />
      </section>

      <section id="options" class="options"></section>
    </section>

    <section class="bottom">
      <button id="nextBtn" class="next hidden">Continue</button>
    </section>
  </main>

  <script src="../scripts/vocabulary.js"></script>
  <script src="js/level-loader.js"></script>
  <script src="../scripts/save.js"></script>
</body>
</html>
