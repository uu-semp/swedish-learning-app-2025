<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Var bor jag? - Game 15</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="welcomeComponent.css" />

  <!-- Core scripts - MUST load first -->
  <script src="../scripts/vocabulary.js"></script>
  <script src="../scripts/save.js"></script>

  <!-- External libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"> 
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <!-- Site specific scripts - Load as ES6 modules -->
  <link rel="stylesheet" href="index.css" />
  <script type="module" src="localStorage.js"></script>
  <script type="module" src="setUpLevels.js"></script>
  <script type="module" src="welcomeComponent.js"></script>
  <script type="module" src="index.js"></script>

  <script>
    function toggleLang() {
      const current = sessionStorage.getItem('game15_lang');
      sessionStorage.setItem('game15_lang', current === 'en' ? 'sv' : 'en');
      location.reload(); 
    }
    
    document.addEventListener("DOMContentLoaded", () => {
      const isEn = sessionStorage.getItem('game15_lang') === 'en';
      const btn = document.getElementById('lang-btn');
      if (btn) btn.innerHTML = isEn ? 'Byt till Svenska' : 'Switch to English';
      
      if (isEn) {
        document.querySelectorAll('[data-en]').forEach(el => {
          if (el.tagName.toLowerCase() === 'title') {
            document.title = el.getAttribute('data-en');
          } else {
            el.childNodes[0].nodeValue = el.getAttribute('data-en');
          }
        });
      }
    });
  </script>
</head>
<body>
  <main class="game-frame">
    <div class="welcome-container">
      <button id="lang-btn" class="lang-toggle-btn" onclick="toggleLang()" style="position: static; display: block; margin: 0 auto 20px auto;"> Switch to English </button>
      <h1 class="game-title" data-sv="Var bor jag?" data-en="Where do I live?">Var bor jag?</h1>
      <h2 class="welcome-message" data-sv="Välkommen!" data-en="Welcome!">Välkommen!</h2>
      <p class="subtitle" data-sv="Välj en nivå..." data-en="Choose a level...">Välj en nivå...</p>
      
      <div class="level-buttons" id="levelButtons">
        <!-- Levels will be populated by JavaScript -->
      </div>
      
      <button class="summary-btn" data-sv="Visa resultat" data-en="Show results" onclick="showSummary()">Visa resultat</button>
    </div>

    <!-- Summary Modal -->
    <div id="summaryModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 data-sv="Elevens Framsteg" data-en="Student Progress">Elevens Framsteg</h2>
          <span class="close" onclick="closeSummary()">&times;</span>
        </div>
        <div class="modal-body" id="summaryContent">
          <!-- Summary content will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </main>

  <footer>
    <small>Created as part of the "Software Engineering and Project Management" course 2025</small>
  </footer>
</body>
</html>
