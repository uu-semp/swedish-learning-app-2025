<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Basic Static Site</title>
  <link rel="stylesheet" href="../style.css" />

  <script src="../scripts/vocabulary.js"></script>
  <script src="../scripts/save.js"></script>

  <!-- You are allowed to use JQuery and Vue.js but don't have to. They just make a
  lot of things easier
  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Site specific scripts and styles -->
  <link rel="stylesheet" href="results-page.css" />
  <script src="results-page.js" defer></script>
  <script src="game-page.js" defer></script>

</head>
 
<body>
  <header>
    <h1>Game 07</h1>
  </header>

  <main class="game-frame">
    <div class="resultbox">
      <h1 id="message"></h1>
      <p id="total-result"></p>
      <div id="highscore-notice" style="font-weight: 600; color: #2e7d32; margin-bottom: 8px;"></div>
      <div id="missed-words-container" style="display: none; width: 100%; max-width: 420px; background: #fdfdfd; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 10px 0; text-align: left; max-height: 150px; overflow-y: auto;">
        <h4 style="margin: 0 0 8px 0; color: #b71c1c; font-size: 15px;">Words to Practice:</h4>
        <ul id="missed-words-list" style="margin: 0; padding-left: 20px; font-size: 14px;"></ul>
      </div>
      <div>
        <button id="tryagain-button" class="resultbutton">Try again</button>
        <button id="try-missed-words-button" class="resultbutton">Try missed words again</button>
        <button class="resultbutton" onclick="window.location.href='highscore-page.html'">High Scores</button>
        <button class="resultbutton" onclick="window.location.href='index.html'">Back to main menu</button>
      </div>
    </div>
  </main>

  <footer>
    <small>Created as part of the "Software Engineering and Project Management" course 2025</small>
  </footer>
</body>

</html>
